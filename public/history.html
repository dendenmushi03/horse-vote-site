<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予想履歴</title>
  <link rel="stylesheet" href="style-race.css">
  <style>
    .history-card {
      background: #fff;
      border-radius: 12px;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 600px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .history-card h3 {
      margin-top: 0;
    }
    .horse-entry {
      margin-left: 1rem;
    }
  </style>
</head>
<body>
  <div class="card header-card">
    <h1>📚 予想履歴</h1>
    <a href="index.html"><button class="green-btn">トップページへ</button></a>
    <button class="red-btn" onclick="clearHistory()">履歴を全削除</button>
  </div>
  <div id="historyContainer"></div>

  <script>
    const container = document.getElementById("historyContainer");
    const history = JSON.parse(localStorage.getItem("raceHistory")) || [];

    if (history.length === 0) {
      container.innerHTML = "<p style='text-align:center;'>履歴がありません。</p>";
    } else {
      history.reverse().forEach(entry => {
        const div = document.createElement("div");
        div.className = "history-card";
        div.innerHTML = `
          <h3>${entry.title}</h3>
          <p><small>${entry.date}</small></p>
          <ul>
            ${entry.horses.map(h => `<li class="horse-entry">${h.number} ${h.name}：${h.score}</li>`).join("")}
          </ul>
        `;
        container.appendChild(div);
      });
    }

    function clearHistory() {
      if (confirm("本当に履歴を全て削除しますか？")) {
        localStorage.removeItem("raceHistory");
        location.reload();
      }
    }
  </script>
</body>
</html>
